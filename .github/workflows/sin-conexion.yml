name: Versión sin conexión

# Arma el programa para Windows (CroquisPM.exe) y el mapa local de las comunas del CBS,
# y los publica en la release "sin-conexion". El mapa se rehace cada lunes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['local/**', 'index.html', '.github/workflows/sin-conexion.yml']
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Descargar OpenStreetMap de Chile (Geofabrik) y recortar las comunas del CBS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSL --retry 6 --retry-all-errors --retry-delay 30 -o chile.osm.pbf https://download.geofabrik.de/south-america/chile-latest.osm.pbf
          BBOX=$(cd local && python -c "import croquis_pm as C;b=C.COMUNAS.values();B=C.BUFFER;print(f'{min(x[1] for x in b)-B},{min(x[0] for x in b)-B},{max(x[3] for x in b)+B},{max(x[2] for x in b)+B}')")
          echo "bbox $BBOX"
          osmium extract -b "$BBOX" --strategy complete_ways chile.osm.pbf -o cbs.osm.pbf
          ls -la *.pbf
      - name: Armar el mapa local (calles, numeración, edificios)
        run: |
          pip install osmium
          cd local && python mapa_desde_pbf.py ../cbs.osm.pbf ../salida
      - uses: actions/upload-artifact@v4
        with: {name: mapa, path: salida/mapa-cbs.zip}

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Crear CroquisPM.exe
        shell: pwsh
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name CroquisPM --add-data "index.html;." local/croquis_pm.py
          New-Item -ItemType Directory -Force paquete | Out-Null
          Copy-Item dist/CroquisPM.exe paquete/
          Copy-Item local/LEEME.txt paquete/
          Copy-Item local/croquis_pm.py paquete/
          if (Test-Path paquete/mapa_desde_pbf.py) { Remove-Item paquete/mapa_desde_pbf.py }
          Copy-Item index.html paquete/
          Copy-Item "local/Iniciar con Python.bat" paquete/
          Compress-Archive -Path paquete/* -DestinationPath CroquisPM-Windows.zip
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: CroquisPM-Windows.zip}

  publicar:
    needs: [mapa, windows]
    if: always() && (needs.mapa.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: art}
      - name: Publicar en la release "sin-conexion"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view sin-conexion >/dev/null 2>&1 || gh release create sin-conexion --title "Croquis PM · versión sin conexión" --notes "Programa para Windows y mapa local de las comunas del CBS. Se actualiza automáticamente."
          for f in art/*/*.zip; do gh release upload sin-conexion "$f" --clobber; done
